---
# ci-cache-server Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-cache-server
  labels:
    app.kubernetes.io/name: cluster-ci-cache
    app.kubernetes.io/component: server
spec:
  # S3/MinIO owns manifests and blobs, so the server remains stateless.
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: cluster-ci-cache
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cluster-ci-cache
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: ci-cache-server
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: server
          image: registry.quantum-forge.net/cluster-ci-cache/ci-cache@sha256:8eb50ba657fcaebd01a0bb9a7f572238ea76fde14c1c625537f354c1d226be8f
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: CI_CACHE_CONFIG
              value: /etc/ci-cache/config.yaml
            - name: CI_CACHE_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ci-cache-auth
                  key: token
            - name: CI_CACHE_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ci-cache-s3-creds
                  key: access-key
            - name: CI_CACHE_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ci-cache-s3-creds
                  key: secret-key
            - name: RUST_LOG
              value: "info,ci_cache_server=debug"
          volumeMounts:
            - name: config
              mountPath: /etc/ci-cache
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              # v0.1.0 buffers one bounded cache shard per request. pnpm's
              # two-hex shards remain below max_body_bytes, but need headroom
              # beyond the compressed request body while hashing/storing it.
              memory: 2Gi
      volumes:
        - name: config
          configMap:
            name: ci-cache-config
---
# ci-cache-server Service
apiVersion: v1
kind: Service
metadata:
  name: ci-cache-server
  labels:
    app.kubernetes.io/name: cluster-ci-cache
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cluster-ci-cache
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
# Private LAN ingress for VM/LXC runners that cannot resolve cluster DNS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ci-cache-server-lan
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /ci-cache(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: ci-cache-server
                port:
                  name: http
